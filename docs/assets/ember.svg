<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-labelledby="t">
  <title id="t">Ember, the sitewarm mascot: a small flame with a check badge</title>
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F0602A"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="1" stop-color="#FFC94D"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="120" cy="244" rx="62" ry="9" fill="#000" opacity=".12"/>
  <!-- outer flame -->
  <path d="M120 14
           C 132 52, 176 70, 188 120
           C 202 178, 166 236, 120 236
           C 74 236, 38 178, 52 128
           C 58 104, 74 92, 82 74
           C 88 94, 96 102, 104 104
           C 98 72, 104 40, 120 14 Z"
        fill="url(#outer)" stroke="#C2421A" stroke-width="4" stroke-linejoin="round"/>
  <!-- inner flame (belly) -->
  <path d="M120 104
           C 128 126, 156 140, 156 178
           C 156 206, 140 220, 120 220
           C 100 220, 84 206, 84 180
           C 84 158, 100 150, 106 134
           C 110 144, 114 148, 118 148
           C 114 132, 114 118, 120 104 Z"
        fill="url(#inner)"/>
  <!-- eyes -->
  <ellipse cx="102" cy="160" rx="7" ry="9" fill="#3B1D0E"/>
  <ellipse cx="138" cy="160" rx="7" ry="9" fill="#3B1D0E"/>
  <circle cx="104.5" cy="156.5" r="2.6" fill="#fff"/>
  <circle cx="140.5" cy="156.5" r="2.6" fill="#fff"/>
  <!-- cheeks -->
  <ellipse cx="90" cy="178" rx="8" ry="5" fill="#FF7A59" opacity=".55"/>
  <ellipse cx="150" cy="178" rx="8" ry="5" fill="#FF7A59" opacity=".55"/>
  <!-- smile -->
  <path d="M108 180 Q120 192 132 180" fill="none" stroke="#3B1D0E" stroke-width="4" stroke-linecap="round"/>
  <!-- check badge: a verified HIT -->
  <g transform="translate(176 188)">
    <circle r="24" fill="#22A35A" stroke="#fff" stroke-width="5"/>
    <path d="M-11 1 L-3 9 L12 -8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
