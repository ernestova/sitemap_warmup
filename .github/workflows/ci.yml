name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        # arm64 covers Apple silicon, Windows on ARM and Linux on AWS Graviton.
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/ernestova/sitemap_warmup/pkg/sitewarm.Version=${GITHUB_SHA::7}" \
            -o "dist/sitewarm_${GOOS}_${GOARCH}${ext}" ./cmd/sitewarm
      - uses: actions/upload-artifact@v7
        with:
          name: sitewarm_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/
          retention-days: 14
