name: Auto-close duplicate issues

# Closes an open issue as a duplicate when a bot comment flagged it
# ("Found N possible duplicate issues: #123 ...") at least 3 days ago and
# nobody has commented since. The issue author can veto it with a 👎 on
# that comment. Reopening the issue is enough to undo a wrong close.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only log what would be closed"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: auto-close-duplicates
  cancel-in-progress: false

jobs:
  auto-close-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry-run || false }}
        with:
          script: |
            const GRACE_MS = 3 * 24 * 60 * 60 * 1000;
            const cutoff = Date.now() - GRACE_MS;
            const dryRun = process.env.DRY_RUN === 'true';
            const { owner, repo } = context.repo;

            // A detection comment comes from a bot and names the issue it duplicates.
            const isDetection = (c) =>
              c.user?.type === 'Bot' &&
              /\bFound\b/.test(c.body ?? '') &&
              /possible duplicate/i.test(c.body ?? '');

            const duplicateOf = (body) => {
              const m =
                body.match(/#(\d+)/) ??
                body.match(/github\.com\/[^/]+\/[^/]+\/issues\/(\d+)/);
              return m ? Number(m[1]) : null;
            };

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });

            let closed = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (Date.parse(issue.created_at) > cutoff) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const detections = comments.filter(isDetection);
              if (detections.length === 0) continue;

              const last = detections[detections.length - 1];
              const flaggedAt = Date.parse(last.created_at);
              if (flaggedAt > cutoff) {
                core.info(`#${issue.number}: flagged less than 3 days ago, skipping`);
                continue;
              }
              if (comments.some((c) => Date.parse(c.created_at) > flaggedAt)) {
                core.info(`#${issue.number}: activity after the flag, skipping`);
                continue;
              }

              const reactions = await github.paginate(github.rest.reactions.listForIssueComment, {
                owner, repo, comment_id: last.id, per_page: 100,
              });
              if (reactions.some((r) => r.user?.id === issue.user?.id && r.content === '-1')) {
                core.info(`#${issue.number}: author disagreed (👎), skipping`);
                continue;
              }

              const target = duplicateOf(last.body);
              if (!target || target === issue.number) {
                core.info(`#${issue.number}: no issue number in the flag comment, skipping`);
                continue;
              }

              core.notice(`${dryRun ? '[dry-run] would close' : 'Closing'} #${issue.number} as a duplicate of #${target}`);
              if (dryRun) continue;
              try {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'duplicate',
                });
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: ['duplicate'],
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Closed automatically as a duplicate of #${target}.\n\nIf that's wrong, reopen this issue and we'll take another look.`,
                });
                closed++;
              } catch (err) {
                core.warning(`#${issue.number}: could not close: ${err.message}`);
              }
            }
            core.info(`Checked ${issues.length} open issues, closed ${closed}.`);
